<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}EstateMonitor{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  {% block head %}{% endblock %}
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <header class="shell-top">
    <div class="shell-inner">
      <a class="brand" href="/?deal_type=sale">
        <span class="brand-mark">EM</span>
        <span class="brand-text">
          <span class="brand-name">EstateMonitor</span>
          <span class="brand-tag">Киев · коммерческая недвижимость</span>
        </span>
      </a>
      <nav class="nav" aria-label="Основная навигация">
        <a class="nav-link {% if active_nav == 'sale' %}is-active{% endif %}" href="/?deal_type=sale">Продажа</a>
        <a class="nav-link {% if active_nav == 'rent' %}is-active{% endif %}" href="/?deal_type=rent">Аренда</a>
        <a class="nav-link {% if active_nav == 'market' %}is-active{% endif %}" href="/market?mode=sale">Рынок</a>
        <a class="nav-link {% if active_nav == 'deals' %}is-active{% endif %}" href="/deals?bucket=likely_deal">Сделки</a>
      </nav>
    </div>
  </header>

  <main class="shell-main {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <footer class="shell-foot">
    <div class="shell-inner foot-row">
      <span>EstateMonitor</span>
      <span class="muted">Гипотезы сделок · не юридический факт</span>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
